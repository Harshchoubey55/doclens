# Optional: run the store on PostgreSQL + pgvector instead of SQLite.
#   docker compose up -d
#   set DATABASE_URL=postgresql+psycopg://doclens:doclens@localhost:5432/doclens
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: doclens
      POSTGRES_PASSWORD: doclens
      POSTGRES_DB: doclens
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
volumes:
  pgdata:
